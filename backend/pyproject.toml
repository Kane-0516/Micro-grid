[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "D", "W"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["app"]

# These two files build human-readable text reports as single multi-line
# f-string literals with fixed-width box-drawing borders (e.g.
# economic_analysis.format_full_report, financial_model's
# generate_financial_report). Each source line is one literal output line,
# so wrapping it would change the printed report; E501 is exempted for
# these files only for that reason.
[tool.ruff.lint.per-file-ignores]
"app/services/economic_analysis.py" = ["E501"]
"app/services/financial_model.py" = ["E501"]

[tool.pydocstyle]
convention = "google"

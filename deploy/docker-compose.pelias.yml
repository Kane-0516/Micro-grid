services:
  libpostal:
    image: pelias/libpostal-service
    container_name: pelias_libpostal
    user: "${DOCKER_USER:-pelias}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PELIAS_LIBPOSTAL_PORT:-4400}:4400"

  schema:
    image: pelias/schema:master
    container_name: pelias_schema
    user: "${DOCKER_USER:-pelias}"
    volumes:
      - ./pelias/pelias.json:/code/pelias.json

  api:
    image: pelias/api:master
    container_name: pelias_api
    user: "${DOCKER_USER:-pelias}"
    restart: unless-stopped
    environment:
      PORT: 4000
    ports:
      - "${PELIAS_API_PORT:-4000}:4000"
    volumes:
      - ./pelias/pelias.json:/code/pelias.json

  placeholder:
    image: pelias/placeholder:master
    container_name: pelias_placeholder
    user: "${DOCKER_USER:-pelias}"
    restart: unless-stopped
    environment:
      PORT: 4100
    ports:
      - "127.0.0.1:${PELIAS_PLACEHOLDER_PORT:-4100}:4100"
    volumes:
      - ./pelias/pelias.json:/code/pelias.json
      - ${PELIAS_DATA_DIR:-/opt/docker/pre-sale/pelias-data/us}:/data
      - ./pelias/blacklist:/data/blacklist

  whosonfirst:
    image: pelias/whosonfirst:master
    container_name: pelias_whosonfirst
    user: "${DOCKER_USER:-pelias}"
    volumes:
      - ./pelias/pelias.json:/code/pelias.json
      - ${PELIAS_DATA_DIR:-/opt/docker/pre-sale/pelias-data/us}:/data
      - ./pelias/blacklist:/data/blacklist

  openstreetmap:
    image: pelias/openstreetmap:master
    container_name: pelias_openstreetmap
    user: "${DOCKER_USER:-pelias}"
    volumes:
      - ./pelias/pelias.json:/code/pelias.json
      - ${PELIAS_DATA_DIR:-/opt/docker/pre-sale/pelias-data/us}:/data
      - ./pelias/blacklist:/data/blacklist

  openaddresses:
    image: pelias/openaddresses:master
    container_name: pelias_openaddresses
    user: "${DOCKER_USER:-pelias}"
    volumes:
      - ./pelias/pelias.json:/code/pelias.json
      - ${PELIAS_DATA_DIR:-/opt/docker/pre-sale/pelias-data/us}:/data
      - ./pelias/blacklist:/data/blacklist

  transit:
    image: pelias/transit:master
    container_name: pelias_transit
    user: "${DOCKER_USER:-pelias}"
    volumes:
      - ./pelias/pelias.json:/code/pelias.json
      - ${PELIAS_DATA_DIR:-/opt/docker/pre-sale/pelias-data/us}:/data

  csv-importer:
    image: pelias/csv-importer:master
    container_name: pelias_csv_importer
    user: "${DOCKER_USER:-pelias}"
    volumes:
      - ./pelias/pelias.json:/code/pelias.json
      - ${PELIAS_DATA_DIR:-/opt/docker/pre-sale/pelias-data/us}:/data
      - ./pelias/blacklist:/data/blacklist

  polylines:
    image: pelias/polylines:master
    container_name: pelias_polylines
    user: "${DOCKER_USER:-pelias}"
    volumes:
      - ./pelias/pelias.json:/code/pelias.json
      - ${PELIAS_DATA_DIR:-/opt/docker/pre-sale/pelias-data/us}:/data

  interpolation:
    image: pelias/interpolation:master
    container_name: pelias_interpolation
    user: "${DOCKER_USER:-pelias}"
    restart: unless-stopped
    environment:
      PORT: 4300
    ports:
      - "127.0.0.1:${PELIAS_INTERPOLATION_PORT:-4300}:4300"
    volumes:
      - ./pelias/pelias.json:/code/pelias.json
      - ${PELIAS_DATA_DIR:-/opt/docker/pre-sale/pelias-data/us}:/data

  pip:
    image: pelias/pip-service:master
    container_name: pelias_pip-service
    user: "${DOCKER_USER:-pelias}"
    restart: unless-stopped
    environment:
      PORT: 4200
    ports:
      - "127.0.0.1:${PELIAS_PIP_PORT:-4200}:4200"
    volumes:
      - ./pelias/pelias.json:/code/pelias.json
      - ${PELIAS_DATA_DIR:-/opt/docker/pre-sale/pelias-data/us}:/data

  elasticsearch:
    image: pelias/elasticsearch:7.17.27
    container_name: pelias_elasticsearch
    user: "${DOCKER_USER:-pelias}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PELIAS_ES_HTTP_PORT:-9200}:9200"
      - "127.0.0.1:${PELIAS_ES_TRANSPORT_PORT:-9300}:9300"
    volumes:
      - ${PELIAS_DATA_DIR:-/opt/docker/pre-sale/pelias-data/us}/elasticsearch:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    cap_add:
      - IPC_LOCK

  fuzzy-tester:
    image: pelias/fuzzy-tester:master
    container_name: pelias_fuzzy_tester
    user: "${DOCKER_USER:-pelias}"
    restart: "no"
    command: --help
    volumes:
      - ./pelias/pelias.json:/code/pelias.json
      - ./pelias/test_cases:/code/pelias/fuzzy-tester/test_cases
